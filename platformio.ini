[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
board_build.f_cpu = 16000000L
build_src_filter =
    +<*>
    -<**/main_esp32.cpp>
board_hardware.oscillator = external
upload_speed = 115200
monitor_speed = 115200
lib_deps = fastled/FastLED@^3.10.3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED@^3.10.3
build_src_filter =
    +<*>
    -<**/main_nano.cpp>